<!doctype html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>لوحة إدارة | ANAS BARBER</title>
    <style>
        body {
            margin: 0;
            font-family: "Noto Kufi Arabic","Cairo",sans-serif;
            background: #0f1115;
            color: #e7ebf3
        }

        .wrap {
            width: min(1000px,92vw);
            margin: 24px auto;
            display: grid;
            gap: 16px
        }

        .card {
            background: #0e131b;
            border: 1px solid #2a3241;
            border-radius: 14px;
            padding: 16px;
            display: grid;
            gap: 12px
        }

        h2, h3 {
            margin: 0 0 6px 0
        }

        label {
            display: grid;
            gap: 6px
        }

        input, select {
            background: #0f131b;
            color: #e7ebf3;
            border: 1px solid #2a3241;
            border-radius: 10px;
            padding: 10px
        }

        .grid2 {
            display: grid;
            gap: 12px;
            grid-template-columns: repeat(2,minmax(0,1fr))
        }

        .row {
            display: flex;
            gap: 10px;
            align-items: center;
            flex-wrap: wrap
        }

        .muted {
            color: #8b93a7;
            font-size: 13px
        }

        button {
            cursor: pointer;
            border-radius: 10px;
            border: 1px solid #2a3241;
            background: #10131a;
            color: #e7ebf3;
            padding: 10px 14px
        }

        .primary {
            background: linear-gradient(135deg,#d4af37,#f5d76e);
            color: #0b0d11;
            border: none
        }

        .warn {
            background: #402020;
            border-color: #773333
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px
        }

        th, td {
            padding: 8px 10px;
            border-bottom: 1px solid #2a3241;
            text-align: right
        }

        th {
            background: #151824;
            font-weight: 600
        }

        tbody tr:nth-child(even) {
            background: #10131a
        }

        tbody tr:nth-child(odd) {
            background: #0d1017
        }

        .ok {
            color: #9be49b
        }

        .chip {
            padding: 2px 8px;
            border-radius: 999px;
            font-size: 12px
        }

        .pending {
            background: #3a2f13;
            color: #f7e39a
        }

        .confirmed {
            background: #1f3a20;
            color: #9be49b
        }

        .canceled {
            background: #402020;
            color: #ffb4b4
        }
    </style>
</head>
<body>
    <div class="wrap">

        <div class="card">
            <div class="row" style="justify-content:space-between">
                <h2>الحجوزات المسجلة</h2>
                <div class="row">
                    <button class="primary" onclick="logout()">تسجيل الخروج</button>
                </div>
            </div>
            <div class="row">
                <label>تصفية حسب التاريخ <input type="date" id="fDate"></label>
                <label>
                    الحالة
                    <select id="fStatus">
                        <option value="">الكل</option>
                        <option value="pending">قيد المراجعة</option>
                        <option value="confirmed">مؤكد</option>
                        <option value="canceled">ملغي</option>
                    </select>
                </label>
                <button id="clearFilters">إزالة التصفية</button>
                <span id="bkState" class="muted"></span>
            </div>
            <div style="overflow-x:auto">
                <table>
                    <thead>
                        <tr>
                            <th>الاسم</th>
                            <th>الهاتف</th>
                            <th>الحلاق</th>
                            <th>الخدمة</th>
                            <th>التاريخ</th>
                            <th>الوقت</th>
                            <th>الحالة</th>
                            <th>إجراءات</th>
                        </tr>
                    </thead>
                    <tbody id="bkTableBody"><tr><td colspan="8" class="muted">لا توجد حجوزات</td></tr></tbody>
                </table>
            </div>
        </div>

        <div class="card">
            <h2>الإعدادات العامة (مزامنة مع القاعدة)</h2>
            <div class="grid2">
                <label>من <input id="defStart" type="time"></label>
                <label>إلى <input id="defEnd" type="time"></label>
                <label>
                    فاصل الدقائق
                    <select id="step"><option>15</option><option selected>30</option><option>60</option></select>
                </label>
                <label>
                    أرقام واتساب الحلاق (مفصولة بفواصل)
                    <input id="barberPhones" placeholder="+2189..., +2189...">
                </label>
            </div>

            <h3>استثناءات الأسبوع</h3>
            <div class="grid2">
                <label>
                    اليوم
                    <select id="wdDay">
                        <option value="0">الأحد</option>
                        <option value="1">الاثنين</option>
                        <option value="2">الثلاثاء</option>
                        <option value="3">الأربعاء</option>
                        <option value="4">الخميس</option>
                        <option value="5">الجمعة</option>
                        <option value="6">السبت</option>
                    </select>
                </label>
                <label>من <input id="wdStart" type="time" value="16:00"></label>
                <label>إلى <input id="wdEnd" type="time" value="02:00"></label>
            </div>
            <div class="row">
                <button id="addWd" class="primary">حفظ/تحديث اليوم</button>
                <button id="clearWd" class="warn">حذف اليوم</button>
            </div>
            <div id="wdList" class="muted"></div>

            <h3>إغلاق يوم محدد</h3>
            <div class="row">
                <label>التاريخ <input id="dayPick" type="date"></label>
                <button id="closeAll" class="warn">قفل كل الساعات</button>
                <button id="openAll" class="primary">فتح كل الساعات</button>
                <span id="countInfo" class="muted"></span>
            </div>

            <div class="row">
                <button id="saveConfig" class="primary">حفظ الإعدادات في القاعدة</button>
                <span id="state" class="ok"></span>
            </div>
            <div class="muted">تقرأ صفحة الحجز هذه الإعدادات لحظيًا.</div>
        </div>

    </div>

    <script type="module" src="./auth.js"></script>
    <script type="module">
        import { getApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
        import { getDatabase, ref, onValue, set, get, update, child } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

        const db = getDatabase(getApp());

        // ---------- حجوزات لحظية + إجراءات ----------
        const tbody = document.getElementById("bkTableBody");
        const fDate = document.getElementById("fDate");
        const fStatus = document.getElementById("fStatus");
        const clearFilters = document.getElementById("clearFilters");
        const bkState = document.getElementById("bkState");

        let ALL = [];
        onValue(ref(db, "bookings"), (snap) => {
            ALL = [];
            if (snap.exists()) {
                snap.forEach(ch => { const v = ch.val(); ALL.push({ id: ch.key, ...v }); });
            }
            render();
        });

        clearFilters.onclick = () => { fDate.value = ""; fStatus.value = ""; render(); }

        function render() {
            const t = fDate.value;
            const s = fStatus.value;
            let list = ALL.slice();
            if (t) list = list.filter(x => x.date === t);
            if (s) list = list.filter(x => x.status === s);

            list.sort((a, b) => ((a.date || "") + (a.time || "")).localeCompare((b.date || "") + (b.time || "")));
            tbody.innerHTML = "";
            if (!list.length) { tbody.innerHTML = '<tr><td colspan="8" class="muted">لا توجد حجوزات</td></tr>'; bkState.textContent = ""; return; }

            list.forEach(b => {
                const tr = document.createElement("tr");
                const chipClass = b.status || "pending";
                tr.innerHTML = `
            <td>${b.name || ""}</td>
            <td>${b.phone || ""}</td>
            <td>${b.barber || ""}</td>
            <td>${b.service || ""}</td>
            <td>${b.date || ""}</td>
            <td>${b.time || ""}</td>
            <td><span class="chip ${chipClass}">${statusName(b.status)}</span></td>
            <td class="row">
              <button data-id="${b.id}" data-act="confirm" class="primary">تأكيد</button>
              <button data-id="${b.id}" data-act="cancel" class="warn">إلغاء</button>
            </td>`;
                tbody.appendChild(tr);
            });
            bkState.textContent = "عدد الحجوزات: " + list.length;
        }

        function statusName(s) {
            if (s === "confirmed") return "مؤكد";
            if (s === "canceled") return "ملغي";
            return "قيد المراجعة";
        }

        tbody.addEventListener("click", async (e) => {
            const btn = e.target.closest("button"); if (!btn) return;
            const id = btn.dataset.id; const act = btn.dataset.act;
            const newStatus = act === "confirm" ? "confirmed" : "canceled";
            await update(ref(db, "bookings/" + id), { status: newStatus });

            // نداء Cloud Function لإرسال واتساب حسب الحالة
            try {
                await fetch("https://us-central1-anas-project-39b6b.cloudfunctions.net/sendWhatsAppOnStatusChange", {
                    method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ id, status: newStatus })
                });
            } catch (_) { }
        });

        // ---------- إعدادات متزامنة ----------
        const defStart = document.getElementById("defStart");
        const defEnd = document.getElementById("defEnd");
        const step = document.getElementById("step");
        const barberPhones = document.getElementById("barberPhones");
        const wdDay = document.getElementById("wdDay");
        const wdStart = document.getElementById("wdStart");
        const wdEnd = document.getElementById("wdEnd");
        const addWd = document.getElementById("addWd");
        const clearWd = document.getElementById("clearWd");
        const wdList = document.getElementById("wdList");
        const dayPick = document.getElementById("dayPick");
        const closeAll = document.getElementById("closeAll");
        const openAll = document.getElementById("openAll");
        const countInfo = document.getElementById("countInfo");
        const stateEl = document.getElementById("state");
        const saveConfig = document.getElementById("saveConfig");

        let CONFIG = { step: 30, defaultHours: { start: "14:00", end: "01:00" }, byWeekday: {}, closed: {}, barbers: { list: ["anas"], phones: [] } };
        onValue(ref(db, "config"), (s) => {
            if (s.exists()) { CONFIG = { ...CONFIG, ...s.val() }; hydrate(); renderWdList(); renderDay(); }
        });

        function hydrate() {
            defStart.value = CONFIG.defaultHours.start || "14:00";
            defEnd.value = CONFIG.defaultHours.end || "01:00";
            step.value = String(CONFIG.step || 30);
            barberPhones.value = (CONFIG.barbers?.phones || []).join(", ");
        }

        function renderWdList() {
            const names = ["الأحد", "الاثنين", "الثلاثاء", "الأربعاء", "الخميس", "الجمعة", "السبت"];
            const obj = CONFIG.byWeekday || {};
            wdList.innerHTML = Object.keys(obj).length
                ? Object.entries(obj).map(([k, v]) => `• ${names[+k]}: ${v.start}-${v.end}`).join("<br>")
                : "لا استثناءات أسبوعية";
        }

        async function saveAll() {
            CONFIG.defaultHours = { start: defStart.value, end: defEnd.value };
            CONFIG.step = parseInt(step.value, 10) || 30;
            CONFIG.barbers = CONFIG.barbers || {};
            CONFIG.barbers.phones = barberPhones.value.split(",").map(x => x.trim()).filter(Boolean);

            await set(ref(db, "config"), CONFIG);
            stateEl.textContent = "تم الحفظ ومزامنته";
            setTimeout(() => stateEl.textContent = "", 1500);
        }
        saveConfig.onclick = saveAll;

        addWd.onclick = async () => {
            const d = wdDay.value;
            CONFIG.byWeekday = CONFIG.byWeekday || {};
            CONFIG.byWeekday[d] = { start: wdStart.value, end: wdEnd.value };
            await set(ref(db, "config/byWeekday"), CONFIG.byWeekday);
            renderWdList();
        };
        clearWd.onclick = async () => {
            const d = wdDay.value;
            if (CONFIG.byWeekday) { delete CONFIG.byWeekday[d]; await set(ref(db, "config/byWeekday"), CONFIG.byWeekday); renderWdList(); }
        };

        dayPick.addEventListener("change", renderDay);
        closeAll.onclick = async () => {
            const d = dayPick.value; if (!d) return;
            const st = CONFIG.defaultHours.start || "14:00";
            const en = CONFIG.defaultHours.end || "01:00";
            const stepMin = CONFIG.step || 30;
            const arr = genSlots(st, en, stepMin);
            CONFIG.closed = CONFIG.closed || {};
            CONFIG.closed[d] = arr;
            await set(ref(db, "config/closed/" + d), arr);
            renderDay();
        };
        openAll.onclick = async () => {
            const d = dayPick.value; if (!d) return;
            CONFIG.closed = CONFIG.closed || {};
            await set(ref(db, "config/closed/" + d), []); // فتح الكل
            delete CONFIG.closed[d];
            renderDay();
        };

        const toMin = t => { const [h, m] = t.split(":").map(Number); return h * 60 + m };
        const pad = n => String(n).padStart(2, "0");
        const fromMin = m => `${pad(Math.floor(m / 60) % 24)}:${pad(m % 60)}`;
        function genSlots(start, end, step) {
            const out = []; let s = toMin(start), e = toMin(end); const span = e > s ? (e - s) : (1440 - s) + e; const steps = Math.floor(span / step);
            for (let i = 0; i <= steps; i++) out.push(fromMin((s + i * step) % 1440)); return out;
        }
        function renderDay() {
            const d = dayPick.value; if (!d) { countInfo.textContent = ""; return; }
            const arr = (CONFIG.closed && CONFIG.closed[d]) || [];
            countInfo.textContent = `مقفول: ${arr.length} خانة`;
        }
    </script>
</body>
</html>
