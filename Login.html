<!doctype html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>دخول المشرف | ANAS BARBER</title>
    <style>
        :root {
            --bg: #0f1115;
            --text: #e7ebf3;
            --brand: #d4af37;
            --brand2: #f5d76e;
            --stroke: #242a35;
            --muted: #8b93a7
        }

        body {
            margin: 0;
            font-family: "Noto Kufi Arabic","Cairo",sans-serif;
            background: #0f1115;
            color: var(--text);
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh
        }

        .card {
            background: #0e131b;
            border: 1px solid #2a3241;
            border-radius: 14px;
            padding: 20px 18px;
            width: min(360px,94vw);
            display: grid;
            gap: 14px;
            box-shadow: 0 10px 30px rgba(0,0,0,.35)
        }

        h2 {
            margin: 0 0 6px 0;
            text-align: center;
            font-size: 20px
        }

        .subtitle {
            text-align: center;
            font-size: 13px;
            color: var(--muted);
            margin-bottom: 4px
        }

        label {
            display: grid;
            gap: 6px;
            font-size: 14px
        }

        input {
            background: #0f131b;
            color: #e7ebf3;
            border: 1px solid #2a3241;
            border-radius: 10px;
            padding: 10px;
            font-size: 14px
        }

            input::placeholder {
                color: #6f7687;
                font-size: 13px
            }

        .primary {
            cursor: pointer;
            border-radius: 10px;
            border: none;
            padding: 10px 14px;
            font-size: 14px;
            font-weight: 700;
            background: linear-gradient(135deg,var(--brand),var(--brand2));
            color: #0b0d11
        }

        .error {
            color: #ff8080;
            font-size: 13px;
            text-align: center;
            min-height: 18px
        }

        .msg {
            color: #9be49b;
            font-size: 13px;
            text-align: center;
            min-height: 18px
        }

        .switch {
            text-align: center;
            font-size: 13px;
            color: var(--muted)
        }

            .switch a {
                color: var(--brand2);
                cursor: pointer;
                text-decoration: none;
                font-weight: 700
            }

        hr {
            border: none;
            border-top: 1px solid #2a3241;
            margin: 6px 0 4px
        }

        .oauth {
            display: grid;
            gap: 8px
        }

        .google {
            background: #fff;
            color: #111
        }
    </style>
</head>
<body>
    <div class="card">
        <h2 id="formTitle">دخول المشرف</h2>
        <div class="subtitle">لوحة إدارة ANAS BARBER</div>

        <!-- نموذج تسجيل الدخول -->
        <form id="loginForm">
            <label>
                البريد الإلكتروني
                <input type="email" id="email" required placeholder="admin@example.com" />
            </label>
            <label>
                كلمة المرور
                <input type="password" id="password" required placeholder="••••••••" />
            </label>
            <button type="submit" class="primary">تسجيل الدخول</button>
            <p id="loginError" class="error"></p>
        </form>

        <div class="oauth">
            <button id="googleBtn" class="primary google">تسجيل الدخول عبر Google</button>
        </div>

        <hr>

        <!-- إنشاء حساب مشرف -->
        <form id="registerForm" style="display:none;">
            <label>
                بريد المشرف الجديد
                <input type="email" id="regEmail" required placeholder="new-admin@example.com" />
            </label>
            <label>
                كلمة المرور
                <input type="password" id="regPassword" required placeholder="كلمة مرور قوية" />
            </label>
            <button type="submit" class="primary">إنشاء حساب مشرف</button>
            <p id="regMsg" class="msg"></p>
        </form>

        <div class="switch">
            <span id="toggleText">لا تملك حساب مشرف؟</span>
            <a id="toggleLink">إنشاء حساب جديد</a>
        </div>
    </div>

    <!-- ربط نظام المصادقة -->
    <script type="module" src="./auth.js"></script>

    <!-- تبديل واجهة الدخول/التسجيل -->
    <script>
        const toggleLink = document.getElementById('toggleLink');
        const toggleText = document.getElementById('toggleText');
        const loginForm = document.getElementById('loginForm');
        const registerForm = document.getElementById('registerForm');
        const title = document.getElementById('formTitle');

        toggleLink.addEventListener('click', () => {
            const showLogin = loginForm.style.display !== 'none';
            if (showLogin) {
                loginForm.style.display = 'none'; registerForm.style.display = 'block';
                title.textContent = 'إنشاء حساب مشرف';
                toggleText.textContent = 'لديك حساب بالفعل؟'; toggleLink.textContent = 'العودة لتسجيل الدخول';
            } else {
                loginForm.style.display = 'block'; registerForm.style.display = 'none';
                title.textContent = 'دخول المشرف';
                toggleText.textContent = 'لا تملك حساب مشرف؟'; toggleLink.textContent = 'إنشاء حساب جديد';
            }
        });
    </script>
</body>
</html>
